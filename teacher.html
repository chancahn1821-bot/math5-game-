<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>좌표 탈출 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="config.js"></script>
<style>
/* Layout: 교사용 현황판. 위에 6개 조 카드, 아래에 지도 위 조 위치와 최근 기록. */
:root{
  --paper:#F2F5F7; --grid:#DCE4EA; --card:#FFFFFF; --ink:#16222E; --muted:#5A6B7A;
  --pen:#2459C7; --pen-soft:#E3ECFB; --exit:#C2410C; --exit-soft:#FDEBDD; --ok:#1E7A3C; --ok-soft:#E1F3E6;
  --bad:#B42318; --bad-soft:#FDE8E6; --line:#CBD6DF; --lock:#E7ECF0;
  --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#111820; --grid:#1C2732; --card:#17212B; --ink:#E6EDF3; --muted:#93A4B4;
  --pen:#7FA6F5; --pen-soft:#1B2A45; --exit:#F59A62; --exit-soft:#3A2416; --ok:#6BCB8B; --ok-soft:#16301F;
  --bad:#F28B82; --bad-soft:#3A1A18; --line:#2A3946; --lock:#1B2530; color-scheme:dark}}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px);font-weight:800}
h2{font-size:19px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
button{font:600 14px var(--body);border:1px solid var(--pen);background:var(--pen);color:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--pen)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
input{font:500 15px var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.t{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--tc);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.t .hd{display:flex;align-items:baseline;gap:10px}
.t .no{font:800 26px var(--display);color:var(--tc)}
.t .pg{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.t .chip{margin-left:auto;font:700 12px var(--body);padding:2px 10px;border-radius:99px;background:var(--lock);color:var(--muted)}
.t .chip.solve{background:var(--pen-soft);color:var(--pen)}
.t .chip.move{background:var(--exit-soft);color:var(--exit)}
.t .chip.done{background:var(--ok-soft);color:var(--ok)}
.t .chip.stale{background:var(--bad-soft);color:var(--bad)}
.t .meter{height:8px;background:var(--lock);border-radius:99px;overflow:hidden}
.t .meter i{display:block;height:100%;background:var(--tc)}
.t .st{font-size:14px;overflow-wrap:anywhere}
.t .ago{font-size:12px;color:var(--muted)}
.t.idle{opacity:.6}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.map{position:relative;line-height:0;border-radius:10px;overflow:hidden}
.map img{width:100%;height:auto;display:block}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.log li{display:grid;grid-template-columns:48px 38px 1fr;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.log .tm{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.log .tn{font-weight:700;color:var(--tc)}
.gate{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:14px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel gate" id="gate">
    <h1>좌표 탈출 현황판</h1>
    <p class="muted">교사 코드를 입력하세요.</p>
    <div class="bar"><input id="code" type="password" autocomplete="off" aria-label="교사 코드"><button type="button" id="enter">열기</button></div>
    <p class="err" id="gateErr"></p>
  </div>

  <div id="app" hidden>
    <div style="display:flex;flex-direction:column;gap:22px">
      <header style="display:flex;flex-direction:column;gap:8px">
        <span class="muted" style="font-size:12px;letter-spacing:.08em;font-weight:600">고2 기하 · 교내 방탈출 · 교사용</span>
        <h1>좌표 탈출 현황판</h1>
        <div class="bar">
          <span><span class="dot" id="connDot"></span><span id="connTxt">연결 확인 중…</span></span>
          <span class="muted">5초마다 자동으로 새로고침</span>
          <button type="button" class="ghost" id="refresh">지금 새로고침</button>
        </div>
      </header>

      <section style="display:flex;flex-direction:column;gap:10px">
        <h2>조별 진행</h2>
        <div class="teams" id="teams"></div>
      </section>

      <div class="split">
        <section class="panel" style="display:flex;flex-direction:column;gap:10px">
          <h2>지도 위 위치</h2>
          <div class="map">
            <img src="map.jpg" alt="학교 배치도" width="1438" height="1094">
            <svg id="ov" viewBox="0 0 1438 1094" aria-hidden="true"></svg>
          </div>
          <p class="muted" style="font-size:13px">원은 각 조가 마지막으로 도착 확인한 장소예요. 점선 화살표는 지금 이동 중인 목적지예요.</p>
        </section>
        <section class="panel" style="display:flex;flex-direction:column;gap:10px">
          <h2>최근 기록</h2>
          <ul class="log" id="log"><li class="muted" style="display:block">아직 기록이 없어요.</li></ul>
        </section>
      </div>

      <section class="panel" style="display:flex;flex-direction:column;gap:10px">
        <h2>수업 시작 전 초기화</h2>
        <p class="muted">이전 수업의 기록을 지우고 모든 조를 ‘시작 전’으로 돌려요. 구글 시트의 기록도 함께 지워져요.</p>
        <div class="bar"><button type="button" class="ghost" id="reset">기록 초기화</button><span id="resetMsg" class="muted"></span></div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
var URL_=(window.SCRIPT_URL||"").trim();
var CODE=window.TEACHER_CODE||"mathchan";
var COLORS=["#2459C7","#C2410C","#1E7A3C","#7B3FB8","#A61E4D","#0E7490"];
var PLACES={G:[0,0,"정문"],E:[8,-8,"본관 북쪽 현관"],M:[5,-17,"구름다리(3층)"],N:[5,-17,"구름다리 아래"],F:[32,-22,"운동장 중심"],X:[35.6,-14,"운동장 교점"],P:[32,-4,"주차장"],H:[27,0,"후문"]};
var O={x:350,y:125,u:21.4};
function px(k){var p=PLACES[k]||PLACES.G;return [O.x+O.u*p[0],O.y-O.u*p[1]];}
var data=null, timer=null;

function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}
function ago(ms){if(!ms)return "";var s=Math.max(0,Math.round((Date.now()-ms)/1000));if(s<60)return s+"초 전";var m=Math.floor(s/60);return m+"분 전";}
function hm(ms){if(!ms)return "";var d=new Date(ms);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

function renderTeams(){
  var byTeam={};(data&&data.teams||[]).forEach(function(t){byTeam[t.team]=t;});
  var h="";
  for(var n=1;n<=6;n++){
    var t=byTeam[n],c=COLORS[n-1];
    if(!t){h+='<div class="t idle" style="--tc:'+c+'"><div class="hd"><span class="no">'+n+'조</span><span class="chip">시작 전</span></div><div class="meter"><i style="width:0"></i></div><p class="st muted">아직 조를 선택한 대표 학생이 없어요.</p></div>';continue;}
    var stale=t.updated&&(Date.now()-t.updated>3*60*1000)&&!t.done;
    var chip=t.done?'<span class="chip done">탈출 성공</span>':t.moving?'<span class="chip move">이동 중</span>':'<span class="chip solve">'+t.current+'번 풀이 중</span>';
    if(t.penalty)chip+='<span class="chip stale" style="margin-left:6px">감점 −'+t.penalty+'</span>';
    if(stale)chip+='<span class="chip stale" style="margin-left:6px">'+Math.floor((Date.now()-t.updated)/60000)+'분째 그대로</span>';
    var pct=Math.min(100,(t.solved/10)*100);
    h+='<div class="t" style="--tc:'+c+'"><div class="hd"><span class="no">'+n+'조</span><span class="pg">'+t.solved+' / 10</span>'+chip+'</div><div class="meter"><i style="width:'+pct+'%"></i></div><p class="st">'+esc(t.status)+'</p><span class="ago">마지막 변화 '+ago(t.updated)+'</span></div>';
  }
  document.getElementById("teams").innerHTML=h;
}
function renderMap(){
  var g="";var byPlace={};
  (data&&data.teams||[]).forEach(function(t){var k=PLACES[t.place]?t.place:"G";(byPlace[k]=byPlace[k]||[]).push(t);});
  Object.keys(byPlace).forEach(function(k){
    byPlace[k].forEach(function(t,i){
      var p=px(k),c=COLORS[t.team-1],ang=i*Math.PI/3,r=byPlace[k].length>1?34:0;
      var x=p[0]+r*Math.cos(ang),y=p[1]+r*Math.sin(ang);
      if(t.moving&&PLACES[t.target]){var q=px(t.target);
        g+='<line x1="'+x+'" y1="'+y+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="'+c+'" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#ah'+t.team+')"/>';
        g+='<defs><marker id="ah'+t.team+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+c+'"/></marker></defs>';}
      g+='<circle cx="'+x+'" cy="'+y+'" r="26" fill="'+c+'" stroke="#fff" stroke-width="5"/><text x="'+x+'" y="'+(y+10)+'" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="Gothic A1,sans-serif">'+t.team+'</text>';
    });
  });
  document.getElementById("ov").innerHTML=g;
}
function renderLog(){
  var r=(data&&data.recent)||[];
  document.getElementById("log").innerHTML=r.length?r.map(function(e){return '<li style="--tc:'+(COLORS[e.team-1]||"#888")+'"><span class="tm">'+hm(e.t)+'</span><span class="tn">'+e.team+'조</span><span>'+esc(e.status)+'</span></li>';}).join(""):'<li class="muted" style="display:block">아직 기록이 없어요.</li>';
}
function setConn(ok,txt){document.getElementById("connDot").className="dot "+(ok?"ok":"bad");document.getElementById("connTxt").textContent=txt;}
function load(){
  if(!URL_){setConn(false,"config.js에 웹 앱 주소(SCRIPT_URL)를 넣어 주세요");return;}
  fetch(URL_+(URL_.indexOf("?")<0?"?":"&")+"action=status&t="+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok)throw 0; data=j; setConn(true,"연결됨 · "+hm(Date.now())+" 기준"); renderTeams(); renderMap(); renderLog();
  }).catch(function(){setConn(false,"서버에 연결하지 못했어요 · 주소와 배포 설정을 확인하세요");});
}
function start(){document.getElementById("gate").hidden=true;document.getElementById("app").hidden=false;renderTeams();load();timer=setInterval(load,5000);setInterval(function(){if(data)renderTeams();},1000);}
function tryEnter(){if(document.getElementById("code").value===CODE){try{sessionStorage.setItem("coord-t","1");}catch(e){}start();}else{document.getElementById("gateErr").textContent="코드가 달라요.";}}
document.getElementById("enter").onclick=tryEnter;
document.getElementById("code").addEventListener("keydown",function(e){if(e.key==="Enter")tryEnter();});
document.getElementById("refresh").onclick=load;
var armed=false;
document.getElementById("reset").onclick=function(){
  var b=this,m=document.getElementById("resetMsg");
  if(!armed){armed=true;b.textContent="한 번 더 누르면 초기화";m.textContent="모든 조의 기록이 지워져요.";setTimeout(function(){armed=false;b.textContent="기록 초기화";},4000);return;}
  armed=false;b.textContent="기록 초기화";m.textContent="초기화 중…";
  fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"reset",key:CODE})})
    .then(function(r){return r.json();}).then(function(j){m.textContent=j&&j.ok?"초기화했어요.":"초기화하지 못했어요: "+((j&&j.error)||"");load();})
    .catch(function(){m.textContent="초기화하지 못했어요. 연결을 확인하세요.";});
};
try{if(sessionStorage.getItem("coord-t")==="1")start();}catch(e){}
})();
</script>
</body>
</html>
